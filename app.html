<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>公用車管理アプリ</title>
<style>
:root {
--primary: #1F4E79; --primary-light: #D6E4F0;
--success: #375623; --success-light: #E2EFDA;
--warning: #7B3F00; --warning-light: #FCE4D6;
--danger: #C00000; --danger-light: #FFE2E2;
--gray: #595959; --gray-light: #F5F5F5; --border: #D0D0D0;
--radius: 10px; --radius-sm: 6px;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: "Hiragino Kaku Gothic ProN","Meiryo",sans-serif; background:#F0F4F8; color:#222; font-size:15px; }
.nav { background:var(--primary); color:#fff; display:flex; }
.nav-btn { flex:1; padding:14px 4px; font-size:12px; font-weight:bold; text-align:center; cursor:pointer; border:none; background:transparent; color:rgba(255,255,255,0.65); line-height:1.4; }
.nav-btn.active { background:rgba(255,255,255,0.18); color:#fff; border-bottom:3px solid #fff; }
.nav-btn i { display:block; font-size:20px; margin-bottom:2px; }
.page { display:none; padding:16px; max-width:480px; margin:0 auto; }
.page.active { display:block; }
.card { background:#fff; border-radius:var(--radius); border:1px solid var(--border); padding:16px; margin-bottom:12px; }
.card-title { font-size:12px; font-weight:bold; color:var(--gray); text-transform:uppercase; letter-spacing:.05em; margin-bottom:12px; padding-bottom:8px; border-bottom:1px solid var(--border); }
.field { margin-bottom:12px; }
.field:last-child { margin-bottom:0; }
label { display:block; font-size:12px; color:var(--gray); margin-bottom:4px; font-weight:bold; }
input[type=text],input[type=number],input[type=time],select,textarea { width:100%; padding:10px 12px; border:1px solid var(--border); border-radius:var(--radius-sm); font-size:15px; font-family:inherit; background:#fff; color:#222; -webkit-appearance:none; appearance:none; }
input:focus,select:focus,textarea:focus { outline:none; border-color:var(--primary); box-shadow:0 0 0 3px rgba(31,78,121,0.12); }
textarea { height:64px; resize:none; line-height:1.5; }
.row2 { display:grid; grid-template-columns:1fr 1fr; gap:10px; }
.required { color:var(--danger); margin-left:2px; }
.preset { background:var(--gray-light); border:1px solid var(--border); border-radius:var(--radius-sm); padding:10px 12px; font-size:15px; color:#222; display:flex; justify-content:space-between; align-items:center; }
.preset-note { font-size:11px; color:var(--gray); background:var(--primary-light); padding:2px 7px; border-radius:20px; white-space:nowrap; }
.preset.loading { color:var(--gray); font-style:italic; }
.check-row { display:flex; align-items:center; justify-content:space-between; padding:10px 0; border-bottom:1px solid var(--border); }
.check-row:last-child { border-bottom:none; }
.check-label { font-size:14px; }
.toggle-wrap { position:relative; }
.toggle-wrap input[type=checkbox] { opacity:0; width:0; height:0; position:absolute; }
.toggle-track { display:block; width:44px; height:24px; background:var(--border); border-radius:12px; cursor:pointer; transition:background .2s; position:relative; }
.toggle-track::after { content:""; position:absolute; top:3px; left:3px; width:18px; height:18px; border-radius:50%; background:#fff; transition:transform .2s; }
.toggle-wrap input:checked + .toggle-track { background:var(--success); }
.toggle-wrap input:checked + .toggle-track::after { transform:translateX(20px); }
.result-group { display:grid; grid-template-columns:1fr 1fr; gap:10px; }
.result-btn { padding:14px; border-radius:var(--radius-sm); border:1.5px solid var(--border); background:#fff; font-size:15px; font-weight:bold; cursor:pointer; text-align:center; transition:all .15s; color:var(--gray); }
.result-btn.ok.selected { background:var(--success-light); border-color:var(--success); color:var(--success); }
.result-btn.ng.selected { background:var(--danger-light); border-color:var(--danger); color:var(--danger); }
.timing-group { display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-bottom:14px; }
.timing-btn { padding:12px; border-radius:var(--radius-sm); border:1.5px solid var(--border); background:#fff; font-size:14px; font-weight:bold; cursor:pointer; text-align:center; color:var(--gray); transition:all .15s; }
.timing-btn.selected { background:var(--primary-light); border-color:var(--primary); color:var(--primary); }
.submit-btn { width:100%; padding:15px; border-radius:var(--radius); border:none; font-size:16px; font-weight:bold; cursor:pointer; margin-top:4px; transition:opacity .15s; }
.submit-btn:active { opacity:.8; }
.submit-btn.departure { background:var(--primary); color:#fff; }
.submit-btn.return-btn { background:var(--success); color:#fff; }
.submit-btn.alcohol { background:var(--warning); color:#fff; }
.submit-btn:disabled { opacity:.5; cursor:not-allowed; }
.calc-box { background:var(--success-light); border:1px solid #A9D18E; border-radius:var(--radius); padding:14px 16px; margin-bottom:12px; display:flex; justify-content:space-between; align-items:center; }
.calc-label { font-size:13px; color:var(--success); font-weight:bold; }
.calc-val { font-size:24px; font-weight:bold; color:var(--success); }
.alert { border-radius:var(--radius-sm); padding:10px 12px; font-size:13px; margin-bottom:10px; }
.alert.info { background:var(--primary-light); color:var(--primary); border:1px solid #A0C4E8; }
.alert.danger { background:var(--danger-light); color:var(--danger); border:1px solid #FFAAAA; }
.alert.success { background:var(--success-light); color:var(--success); border:1px solid #A9D18E; }
.mission-key-box { background:#fff; border:2px dashed var(--primary); border-radius:var(--radius); padding:14px 16px; margin-bottom:12px; text-align:center; }
.mission-key-label { font-size:12px; color:var(--gray); margin-bottom:4px; }
.mission-key-val { font-size:18px; font-weight:bold; color:var(--primary); letter-spacing:.05em; font-family:monospace; }
.mission-key-note { font-size:11px; color:var(--gray); margin-top:6px; }
.loading-overlay { display:none; position:fixed; inset:0; background:rgba(0,0,0,0.35); z-index:100; align-items:center; justify-content:center; }
.loading-overlay.active { display:flex; }
.spinner { width:44px; height:44px; border:4px solid rgba(255,255,255,0.3); border-top-color:#fff; border-radius:50%; animation:spin .8s linear infinite; }
@keyframes spin { to { transform:rotate(360deg); } }
.success-screen { display:none; text-align:center; padding:40px 20px; }
.success-screen.active { display:block; }
.success-icon { font-size:60px; color:var(--success); margin-bottom:16px; }
.success-title { font-size:20px; font-weight:bold; margin-bottom:8px; }
.success-sub { font-size:14px; color:var(--gray); margin-bottom:24px; }
.reset-btn { padding:12px 32px; border-radius:var(--radius); border:2px solid var(--primary); background:#fff; color:var(--primary); font-size:15px; font-weight:bold; cursor:pointer; }
</style>
</head>
<body>

<nav class="nav">
<button class="nav-btn active" onclick="switchPage('dep')" id="nav-dep"><i>🚗</i>出発前</button>
<button class="nav-btn" onclick="switchPage('ret')" id="nav-ret"><i>🏠</i>帰庁後</button>
<button class="nav-btn" onclick="switchPage('alc')" id="nav-alc"><i>📋</i>アルコール</button>
</nav>

<div class="loading-overlay" id="loading"><div class="spinner"></div></div>

<!-- ===== 出発前 ===== -->
<div class="page active" id="page-dep">
<div id="dep-form">

  <!-- 【変更③】車両情報カード：QRあり／なしで切り替え -->
  <div class="card">
    <div class="card-title">車両情報</div>
    <!-- QRあり：プリセット表示 -->
    <div id="dep-qr-info">
      <div class="field"><label>車両名</label><div class="preset loading" id="dep-vehicle-name">読み込み中...</div></div>
      <div class="field"><label>車両番号</label><div class="preset" id="dep-vehicle-number">-</div></div>
    </div>
    <!-- QRなし：プルダウン選択 -->
    <div id="dep-vehicle-select-wrap" style="display:none;">
      <div class="field">
        <label>車両を選択<span class="required">*</span></label>
        <select id="dep-vehicle-select"><option value="">選択してください</option></select>
      </div>
    </div>
    <div class="field"><label>前回帰庁メーター（参考・手入力可）</label><input type="number" id="dep-last-meter" placeholder="前回の帰庁メーター" min="0"></div>
  </div>

  <div class="card">
    <div class="card-title">運転者情報</div>
    <div class="row2">
      <div class="field"><label>氏名<span class="required">*</span></label><input type="text" id="dep-name" placeholder="山田 太郎" autocomplete="name"></div>
      <div class="field"><label>所属課<span class="required">*</span></label><select id="dep-dept"><option value="">選択してください</option></select></div>
    </div>
  </div>
  <div class="card">
    <div class="card-title">出発前記録</div>
    <div class="row2">
      <div class="field"><label>出発時刻<span class="required">*</span></label><input type="time" id="dep-time"></div>
      <div class="field"><label>出発メーター(km)<span class="required">*</span></label><input type="number" id="dep-meter" placeholder="12480" min="0"></div>
    </div>
    <div class="field"><label>行き先<span class="required">*</span></label><input type="text" id="dep-dest" placeholder="例：○○市役所"></div>
    <div class="field"><label>使用目的</label><input type="text" id="dep-purpose" placeholder="例：会議出席"></div>
    <div class="row2">
      <div class="field"><label>搭乗人数</label><select id="dep-passengers"><option value="1名">1名</option><option value="2名">2名</option><option value="3名">3名</option><option value="4名以上">4名以上</option></select></div>
      <div class="field"><label>燃料残量</label><select id="dep-fuel"><option value="半分以上">半分以上</option><option value="半分未満">半分未満</option></select></div>
    </div>
  </div>
  <div class="card">
    <div class="card-title">出発前点検</div>
    <div class="check-row"><span class="check-label">車体の損傷 異常なし</span><label class="toggle-wrap"><input type="checkbox" id="dep-body-check"><span class="toggle-track"></span></label></div>
    <div class="check-row"><span class="check-label">タイヤ（空気圧） 異常なし</span><label class="toggle-wrap"><input type="checkbox" id="dep-tire-check"><span class="toggle-track"></span></label></div>
    <div class="field" style="margin-top:12px;"><label>特記事項</label><textarea id="dep-notes" placeholder="異常があれば記載"></textarea></div>
  </div>
  <button class="submit-btn departure" onclick="submitDeparture()">出発前記録を送信</button>
</div>
<div class="success-screen" id="dep-success">
  <div class="success-icon">✅</div>
  <div class="success-title">出発前記録を送信しました</div>
  <div class="success-sub">帰庁後に「帰庁後」タブから続きを記録してください</div>
  <button class="reset-btn" onclick="resetDep()">新しい記録を開始</button>
</div>
</div>

<!-- ===== 帰庁後 ===== -->
<div class="page" id="page-ret">
<div id="ret-form">
  <div class="alert info">帰庁後に車内で入力してください。同日の出発前記録と自動で紐づけします。</div>

  <!-- 【変更②】乗務キー入力カードを廃止 → 車両表示カードに変更 -->
  <div class="card">
    <div class="card-title">車両</div>
    <!-- QRあり：プリセット表示 -->
    <div id="ret-vehicle-preset" style="display:none;">
      <div class="field"><label>車両名</label><div class="preset" id="ret-vehicle-display">-</div></div>
    </div>
    <!-- QRなし：プルダウン選択 -->
    <div id="ret-vehicle-select-wrap" style="display:none;">
      <div class="field">
        <label>使用した車両<span class="required">*</span></label>
        <select id="ret-vehicle-select"><option value="">選択してください</option></select>
      </div>
    </div>
    <!-- 自動マッチング結果 -->
    <div id="ret-mission-status" style="display:none;" class="alert info"></div>
  </div>

  <div class="card">
    <div class="card-title">帰庁後記録</div>
    <div class="row2">
      <div class="field"><label>帰庁時刻<span class="required">*</span></label><input type="time" id="ret-time"></div>
      <div class="field"><label>帰庁メーター(km)<span class="required">*</span></label><input type="number" id="ret-meter" placeholder="12534" min="0" oninput="calcDistance()"></div>
    </div>
    <div class="row2">
      <div class="field"><label>燃料残量</label><select id="ret-fuel"><option value="半分以上">半分以上</option><option value="半分未満">半分未満</option></select></div>
      <div class="field"><label>給油量(L)</label><input type="number" id="ret-refuel" placeholder="0" min="0" step="0.1"></div>
    </div>
  </div>
  <div class="calc-box" id="calc-box" style="display:none;">
    <span class="calc-label">🛣 走行距離（自動計算）</span>
    <span class="calc-val" id="calc-distance">- km</span>
  </div>
  <div class="card">
    <div class="card-title">帰庁後点検</div>
    <div class="check-row"><span class="check-label">車体の損傷 異常なし</span><label class="toggle-wrap"><input type="checkbox" id="ret-body-check"><span class="toggle-track"></span></label></div>
    <div class="check-row"><span class="check-label">タイヤ（空気圧） 異常なし</span><label class="toggle-wrap"><input type="checkbox" id="ret-tire-check"><span class="toggle-track"></span></label></div>
    <div class="field" style="margin-top:12px;"><label>特記事項</label><textarea id="ret-notes" placeholder="異常があれば記載"></textarea></div>
  </div>
  <button class="submit-btn return-btn" onclick="submitReturn()">帰庁後記録を送信</button>
</div>
<div class="success-screen" id="ret-success">
  <div class="success-icon">✅</div>
  <div class="success-title">帰庁後記録を送信しました</div>
  <div class="success-sub">執務室でアルコールチェックを行い「アルコール」タブから記録してください</div>
  <button class="reset-btn" onclick="resetRet()">新しい記録を開始</button>
</div>
</div>

<!-- ===== アルコール ===== -->
<div class="page" id="page-alc">
<div id="alc-form">
  <div class="card">
    <div class="card-title">記録タイミング</div>
    <div class="timing-group">
      <button class="timing-btn selected" onclick="selectTiming('乗車前',this)">🚗 乗車前</button>
      <button class="timing-btn" onclick="selectTiming('帰庁後',this)">🏠 帰庁後</button>
    </div>
    <div class="row2">
      <div class="field"><label>運転者氏名<span class="required">*</span></label><input type="text" id="alc-name" placeholder="山田 太郎"></div>
      <div class="field"><label>所属課<span class="required">*</span></label><select id="alc-dept"><option value="">選択してください</option></select></div>
    </div>
    <div class="field"><label>使用車両<span class="required">*</span></label><select id="alc-vehicle"><option value="">選択してください</option></select></div>
  </div>
  <div class="card">
    <div class="card-title">チェック結果</div>
    <div class="row2">
      <div class="field"><label>点呼時刻<span class="required">*</span></label><input type="time" id="alc-time"></div>
      <div class="field"><label>検知値 (mg/L)<span class="required">*</span></label><input type="number" id="alc-value" placeholder="0.000" step="0.001" min="0"></div>
    </div>
    <div class="field">
      <label>酒気帯びの有無<span class="required">*</span></label>
      <div class="result-group">
        <button class="result-btn ok" onclick="selectAlcResult('なし',this)">✓ なし</button>
        <button class="result-btn ng" onclick="selectAlcResult('あり',this)">⚠ あり</button>
      </div>
    </div>
  </div>
  <div class="card">
    <div class="card-title">点呼方法・確認者</div>
    <div class="row2">
      <div class="field"><label>点呼方法<span class="required">*</span></label><select id="alc-method"><option value="対面">対面</option><option value="電話確認">電話確認</option><option value="その他">その他</option></select></div>
      <div class="field"><label>検知器の使用</label><select id="alc-detector"><option value="あり">あり</option><option value="なし">なし</option></select></div>
    </div>
    <div class="field"><label>確認者氏名<span class="required">*</span></label><input type="text" id="alc-confirmer" placeholder="確認者の氏名"></div>
    <div class="field"><label>指示事項・その他</label><textarea id="alc-notes" placeholder="特記事項があれば記載"></textarea></div>
  </div>
  <button class="submit-btn alcohol" onclick="submitAlcohol()">アルコールチェックを記録する</button>
</div>
<div class="success-screen" id="alc-success">
  <div class="success-icon">✅</div>
  <div class="success-title">アルコールチェックを記録しました</div>
  <div class="success-sub" id="alc-success-sub"></div>
  <button class="reset-btn" onclick="resetAlc()">新しい記録を開始</button>
</div>
</div>

<script>
// ============================================================
// 設定
// ============================================================
const GAS_URL = "https://script.google.com/macros/s/AKfycbyN1TrCfrKNTKl_NJ7ITvg5J3XgUMSnge_tC0qmo8qp9MJMlMPcWIT1_4sgVZs154f0/exec";

const urlParams = new URLSearchParams(window.location.search);

// 【変更③②】const → let に変更（プルダウン選択で上書きするため）
let currentVehicleId   = urlParams.get("vid")   || "";
let currentVehicleName = urlParams.get("vname") || "";
let currentVehicleNum  = urlParams.get("vnum")  || "";
let currentMissionKey  = ""; // 【変更②】自動マッチングで取得

let alcTiming = "乗車前";
let alcResult = "";
let masters = { vehicles: [], depts: [] };
let depMeter = 0;

// ============================================================
// GETリクエストのヘルパー
// ============================================================
async function gasGet(params) {
  const url = GAS_URL + "?" + new URLSearchParams(params).toString();
  const res = await fetch(url);
  return res.json();
}

// ============================================================
// 初期化
// ============================================================
window.addEventListener("DOMContentLoaded", async () => {
  setCurrentTime("dep-time");
  setCurrentTime("ret-time");
  setCurrentTime("alc-time");
  await loadMasters();

  // 【変更③】QRあり／なしで出発前の車両エリアを切り替え
  if (currentVehicleId) {
    document.getElementById("dep-qr-info").style.display = "";
    document.getElementById("dep-vehicle-select-wrap").style.display = "none";
    setVehiclePreset();
    await loadLastMeter();
  } else {
    document.getElementById("dep-qr-info").style.display = "none";
    document.getElementById("dep-vehicle-select-wrap").style.display = "";
    document.getElementById("dep-last-meter").value = "";
      document.getElementById("dep-last-meter").placeholder = "車両を選択後に自動取得";
  }

  // 【変更②③】帰庁後の車両エリアを初期設定
  if (currentVehicleId) {
    document.getElementById("ret-vehicle-preset").style.display = "";
    document.getElementById("ret-vehicle-select-wrap").style.display = "none";
    document.getElementById("ret-vehicle-display").innerHTML =
      currentVehicleName + ' <span class="preset-note">QR自動設定</span>';
  } else {
    document.getElementById("ret-vehicle-preset").style.display = "none";
    document.getElementById("ret-vehicle-select-wrap").style.display = "";
  }

  // 【変更③】出発前の車両選択ハンドラ
  document.getElementById("dep-vehicle-select").addEventListener("change", async function() {
    const v = masters.vehicles.find(v => v.id === this.value);
    if (v) {
      currentVehicleId   = v.id;
      currentVehicleName = v.name;
      currentVehicleNum  = v.number || "";
      currentMissionKey  = "";
      await loadLastMeter();
    } else {
      currentVehicleId = currentVehicleName = currentVehicleNum = "";
      document.getElementById("dep-last-meter").value = "";
      document.getElementById("dep-last-meter").placeholder = "車両を選択後に自動取得";
    }
  });

  // 【変更②③】帰庁後の車両選択ハンドラ
  document.getElementById("ret-vehicle-select").addEventListener("change", function() {
    const v = masters.vehicles.find(v => v.id === this.value);
    if (v) {
      currentVehicleId   = v.id;
      currentVehicleName = v.name;
      currentVehicleNum  = v.number || "";
      currentMissionKey  = "";
      autoFetchMissionKey(); // 車両選択と同時に自動検索
    } else {
      currentVehicleId = "";
      currentMissionKey = "";
      document.getElementById("ret-mission-status").style.display = "none";
    }
  });

  // モード切替（アルコール専用QR: ?mode=alc）
  // ※ loadMasters完了後に切り替えることでプルダウンが確実に表示される
  if (urlParams.get("mode") === "alc") {
    switchPage("alc");
    // ナビも確実に切り替え
    document.querySelectorAll(".nav-btn").forEach(b => b.classList.remove("active"));
    document.getElementById("nav-alc").classList.add("active");
  }
});

function setCurrentTime(id) {
  const now = new Date();
  document.getElementById(id).value =
    String(now.getHours()).padStart(2,"0") + ":" + String(now.getMinutes()).padStart(2,"0");
}

async function loadMasters() {
  try {
    const data = await gasGet({ action: "getMasters" });
    if (!data.vehicles) return;
    masters = data;
    populateSelect("dep-dept",       masters.depts,    "name", "name");
    populateSelect("alc-dept",       masters.depts,    "name", "name");
    populateSelect("alc-vehicle",    masters.vehicles, "id",   "name");
    // 【変更③】プルダウン用車両リストを追加
    populateSelect("dep-vehicle-select", masters.vehicles, "id", "name");
    populateSelect("ret-vehicle-select", masters.vehicles, "id", "name");
  } catch(e) { console.error("マスタ読み込みエラー:", e); }
}

function populateSelect(id, items, valKey, labelKey) {
  const sel = document.getElementById(id);
  if (!sel) return;
  (items||[]).forEach(item => {
    const opt = document.createElement("option");
    opt.value = item[valKey];
    opt.textContent = item[labelKey];
    sel.appendChild(opt);
  });
}

function setVehiclePreset() {
  const nameEl = document.getElementById("dep-vehicle-name");
  nameEl.classList.remove("loading");
  nameEl.innerHTML = (currentVehicleName||"不明") + ' <span class="preset-note">QR自動設定</span>';
  document.getElementById("dep-vehicle-number").innerHTML =
    (currentVehicleNum||"-") + ' <span class="preset-note">QR自動設定</span>';
}

async function loadLastMeter() {
  if (!currentVehicleId) return;
  try {
    const data = await gasGet({ action: "getLastMeter", vehicleId: currentVehicleId });
    const el = document.getElementById("dep-last-meter");
    if (data.lastMeter && data.lastMeter > 0) {
      depMeter = data.lastMeter;
      el.value = data.lastMeter;
    } else {
      el.value = "";
      el.placeholder = "記録なし（初回）";
    }
  } catch(e) { document.getElementById("dep-last-meter").placeholder = "取得失敗（手入力してください）"; }
}

// ============================================================
// 【変更②】出発前記録の自動マッチング
// ============================================================
async function autoFetchMissionKey() {
  const statusEl = document.getElementById("ret-mission-status");
  statusEl.style.display = "block";
  statusEl.className = "alert info";
  statusEl.textContent = "🔍 出発前記録を自動検索中...";

  const today = new Date();
  const returnDate = today.getFullYear() + "/" +
    String(today.getMonth()+1).padStart(2,"0") + "/" +
    String(today.getDate()).padStart(2,"0");

  try {
    const data = await gasGet({
      action: "getActiveMission",
      vehicleId: currentVehicleId,
      returnDate: returnDate
    });
    if (data.success) {
      currentMissionKey = data.missionKey;
      statusEl.className = "alert success";
      statusEl.textContent = "✓ 出発前記録と紐づけました";
    } else {
      currentMissionKey = "";
      statusEl.className = "alert danger";
      statusEl.textContent = "⚠ " + (data.error || "本日の出発記録が見つかりません");
    }
  } catch(e) {
    currentMissionKey = "";
    statusEl.className = "alert danger";
    statusEl.textContent = "通信エラー。電波状況を確認してください。";
  }
}

// ============================================================
// ページ切り替え
// ============================================================
function switchPage(page) {
  document.querySelectorAll(".page").forEach(p => p.classList.remove("active"));
  document.querySelectorAll(".nav-btn").forEach(b => b.classList.remove("active"));
  document.getElementById("page-"+page).classList.add("active");
  document.getElementById("nav-"+page).classList.add("active");

  // 【変更②】帰庁後タブに切り替えた時、自動マッチングを実行
  if (page === "ret" && currentVehicleId && !currentMissionKey) {
    autoFetchMissionKey();
  }
}

// ============================================================
// 出発前送信
// ============================================================
async function submitDeparture() {
  const name    = document.getElementById("dep-name").value.trim();
  const dept    = document.getElementById("dep-dept").value;
  const time    = document.getElementById("dep-time").value;
  const meter   = document.getElementById("dep-meter").value;
  const dest    = document.getElementById("dep-dest").value.trim();
  const purpose = document.getElementById("dep-purpose").value.trim();

  if (!name||!dept||!time||!meter||!dest) {
    alert("必須項目（氏名・所属課・出発時刻・出発メーター・行き先）を入力してください。"); return;
  }
  // 【変更③】QRなし時はプルダウン選択を確認
  if (!currentVehicleId) { alert("車両を選択してください。"); return; }

  showLoading(true);
  try {
    const data = await gasGet({
      action: "submitDeparture",
      vehicleId: currentVehicleId, vehicleName: currentVehicleName, vehicleNumber: currentVehicleNum,
      driverName: name, department: dept,
      departureTime: time, departureMeter: meter,
      destination: dest, purpose: purpose,
      passengers: document.getElementById("dep-passengers").value,
      fuelDeparture: document.getElementById("dep-fuel").value,
      inspectionBodyDep: document.getElementById("dep-body-check").checked ? "異常なし" : "要確認",
      inspectionTireDep: document.getElementById("dep-tire-check").checked ? "異常なし" : "要確認",
      notesDep: document.getElementById("dep-notes").value.trim()
    });
    if (data.success) {
      // 【変更②】出発後にmissionKeyを内部保存（帰庁後タブで自動設定）
      currentMissionKey = data.missionKey;
      document.getElementById("dep-form").style.display = "none";
      document.getElementById("dep-success").classList.add("active");
    } else {
      alert("送信エラー：" + data.error);
    }
  } catch(e) { alert("通信エラーが発生しました。電波状況を確認してください。"); }
  finally { showLoading(false); }
}

// ============================================================
// 帰庁後送信
// ============================================================
function calcDistance() {
  const retMeter = Number(document.getElementById("ret-meter").value);
  if (retMeter > 0) {
    document.getElementById("calc-box").style.display = "flex";
    document.getElementById("calc-distance").textContent = "送信後に確定";
  }
}

async function submitReturn() {
  const time  = document.getElementById("ret-time").value;
  const meter = document.getElementById("ret-meter").value;

  // 【変更②③】バリデーション
  if (!currentVehicleId) { alert("車両を選択してください。"); return; }
  if (!time || !meter)   { alert("必須項目（帰庁時刻・帰庁メーター）を入力してください。"); return; }

  // 【変更②】missionKeyが未取得なら自動取得
  if (!currentMissionKey) {
    await autoFetchMissionKey();
    if (!currentMissionKey) {
      alert("出発前記録が見つかりません。先に出発前記録を送信してください。");
      return;
    }
  }

  showLoading(true);
  try {
    const data = await gasGet({
      action: "submitReturn",
      missionKey: currentMissionKey,
      vehicleId:  currentVehicleId,
      returnTime: time, returnMeter: meter,
      fuelReturn: document.getElementById("ret-fuel").value,
      refuelAmount: document.getElementById("ret-refuel").value || "0",
      inspectionBodyRet: document.getElementById("ret-body-check").checked ? "異常なし" : "要確認",
      inspectionTireRet: document.getElementById("ret-tire-check").checked ? "異常なし" : "要確認",
      notesRet: document.getElementById("ret-notes").value.trim()
    });
    if (data.success) {
      document.getElementById("ret-form").style.display = "none";
      document.getElementById("ret-success").classList.add("active");
    } else {
      alert("送信エラー：" + data.error);
    }
  } catch(e) { alert("通信エラーが発生しました。電波状況を確認してください。"); }
  finally { showLoading(false); }
}

// ============================================================
// アルコールチェック送信
// ============================================================
function selectTiming(t, btn) {
  alcTiming = t;
  document.querySelectorAll(".timing-btn").forEach(b => b.classList.remove("selected"));
  btn.classList.add("selected");
}
function selectAlcResult(r, btn) {
  alcResult = r;
  document.querySelectorAll(".result-btn").forEach(b => b.classList.remove("selected"));
  btn.classList.add("selected");
}

async function submitAlcohol() {
  const name      = document.getElementById("alc-name").value.trim();
  const dept      = document.getElementById("alc-dept").value;
  const vehicle   = document.getElementById("alc-vehicle").value;
  const time      = document.getElementById("alc-time").value;
  const value     = document.getElementById("alc-value").value;
  const confirmer = document.getElementById("alc-confirmer").value.trim();
  if (!name||!dept||!vehicle||!time||value===""||!alcResult||!confirmer) {
    alert("必須項目（氏名・所属課・使用車両・点呼時刻・検知値・酒気帯び有無・確認者）を入力してください。"); return;
  }
  showLoading(true);
  try {
    const vehicleObj = (masters.vehicles||[]).find(v => v.id === vehicle);
    const data = await gasGet({
      action: "submitAlcohol",
      driverName: name, department: dept,
      vehicleName: vehicleObj ? vehicleObj.name : vehicle,
      timing: alcTiming, checkTime: time,
      alcoholValue: value, hasAlcohol: alcResult,
      callMethod: document.getElementById("alc-method").value,
      hasDetector: document.getElementById("alc-detector").value,
      confirmerName: confirmer,
      notes: document.getElementById("alc-notes").value.trim()
    });
    if (data.success) {
      document.getElementById("alc-success-sub").textContent =
        alcResult === "あり"
          ? "⚠ 酒気帯びが確認されました。管理者に報告し、乗車を見合わせてください。"
          : alcTiming + "のチェックが完了しました。";
      document.getElementById("alc-form").style.display = "none";
      document.getElementById("alc-success").classList.add("active");
    } else {
      alert("送信エラー：" + data.error);
    }
  } catch(e) { alert("通信エラーが発生しました。電波状況を確認してください。"); }
  finally { showLoading(false); }
}

// ============================================================
// リセット
// ============================================================
function resetDep() {
  document.getElementById("dep-form").style.display = "";
  document.getElementById("dep-success").classList.remove("active");
  ["dep-name","dep-meter","dep-dest","dep-purpose","dep-notes"].forEach(id => document.getElementById(id).value = "");
  document.getElementById("dep-body-check").checked = false;
  document.getElementById("dep-tire-check").checked = false;
  setCurrentTime("dep-time");
}
function resetRet() {
  document.getElementById("ret-form").style.display = "";
  document.getElementById("ret-success").classList.remove("active");
  ["ret-meter","ret-refuel","ret-notes"].forEach(id => document.getElementById(id).value = "");
  document.getElementById("ret-body-check").checked = false;
  document.getElementById("ret-tire-check").checked = false;
  document.getElementById("calc-box").style.display = "none";
  document.getElementById("ret-mission-status").style.display = "none";
  currentMissionKey = ""; // 【変更②】リセット時に乗務キーもクリア
  setCurrentTime("ret-time");
}
function resetAlc() {
  document.getElementById("alc-form").style.display = "";
  document.getElementById("alc-success").classList.remove("active");
  ["alc-name","alc-value","alc-confirmer","alc-notes"].forEach(id => document.getElementById(id).value = "");
  alcResult = "";
  document.querySelectorAll(".result-btn").forEach(b => b.classList.remove("selected"));
  setCurrentTime("alc-time");
}
function showLoading(show) {
  document.getElementById("loading").classList.toggle("active", show);
}
</script>
